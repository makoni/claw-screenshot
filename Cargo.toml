[package]
name = "claw-screenshot"
version = "0.3.0"
edition = "2024"
# MSRV of the heaviest dependency (zbus 6)
rust-version = "1.89"

[dependencies]
zbus = { version = "6.1", features = ["tokio"] }
tokio = { version = "1", features = ["rt", "macros", "time"] }
urlencoding = "2.1"
dirs = "7"
log = "0.4"
env_logger = "0.11"
