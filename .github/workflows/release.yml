name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version for the draft release (e.g., 0.1.0)
        required: true
      name:
        description: Optional release title (defaults to the version)
        required: false
      notes:
        description: Optional release notes (defaults to a placeholder)
        required: false

jobs:
  build-binaries:
    uses: ./.github/workflows/build-binaries.yml
    secrets: inherit

  build-packages:
    needs: build-binaries
    uses: ./.github/workflows/build-packages.yml
    secrets: inherit

  collect-and-release:
    needs: [build-binaries, build-packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download binary artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts/binaries
          github-token: ${{ secrets.RELEASES_PERSONAL_TOKEN }}
          run-id: ${{ needs.build-binaries.outputs.run-id }}

      - name: Download package artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts/packages
          github-token: ${{ secrets.RELEASES_PERSONAL_TOKEN }}
          run-id: ${{ needs.build-packages.outputs.run-id }}

      - name: Collect release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f -print0 | while IFS= read -r -d '' file; do
            cp "$file" release-assets/
          done
          ls -al release-assets

      - name: Prepare release inputs
        id: release_vars
        run: |
          set -euo pipefail
          TAG="${{ inputs.version }}"
          NAME="${{ inputs.name }}"
          NOTES="${{ inputs.notes }}"
          if [ -z "$NAME" ]; then
            NAME="$TAG"
          fi
          if [ -z "$NOTES" ]; then
            NOTES="Release drafted automatically. Update notes before publishing."
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Draft GitHub release and attach assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_vars.outputs.tag }}
          name: ${{ steps.release_vars.outputs.name }}
          body: ${{ steps.release_vars.outputs.notes }}
          draft: true
          files: release-assets/*
          token: ${{ secrets.RELEASES_PERSONAL_TOKEN }}
