name: Publish Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag for the draft release (e.g., 0.1.0)
        required: true
      name:
        description: Optional release title (defaults to the tag)
        required: false
      notes:
        description: Optional release notes (defaults to a placeholder)
        required: false

jobs:
  build-binaries:
    uses: ./.github/workflows/build-binaries.yml
    with:
      tag: ${{ inputs.tag }}

  build-packages:
    needs: build-binaries
    uses: ./.github/workflows/build-packages.yml
    with:
      tag: ${{ inputs.tag }}

  collect-and-release:
    needs: [build-binaries, build-packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Collect artifacts from previous jobs
        run: |
          set -euo pipefail
          mkdir -p release-assets
          # copy artifacts produced by the jobs (they place files in their workspace release/ or root)
          cp -r ${{ github.workspace }}/release release-assets/ || true
          cp -r ${{ github.workspace }}/*.deb release-assets/ || true
          cp -r ${{ github.workspace }}/*.rpm release-assets/ || true
          find release-assets -type f -maxdepth 3 -print

      - name: Prepare release inputs
        id: release_vars
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          NAME="${{ inputs.name }}"
          NOTES="${{ inputs.notes }}"
          if [ -z "$NAME" ]; then
            NAME="$TAG"
          fi
          if [ -z "$NOTES" ]; then
            NOTES="Release drafted automatically. Update notes before publishing."
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Draft GitHub release and attach assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_vars.outputs.tag }}
          name: ${{ steps.release_vars.outputs.name }}
          body: ${{ steps.release_vars.outputs.notes }}
          draft: true
          files: release-assets/*
          token: ${{ secrets.RELEASES_PERSONAL_TOKEN }}
