name: Release (manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag name for the release (e.g. v0.1.0)'
        required: true
        default: ''

jobs:
  trigger-builds:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft GitHub Release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.event.inputs.version }}
          release_name: Release ${{ github.event.inputs.version }}
          body: "Automated draft release: artifacts will be produced by build workflows. This release is a draft until artifacts are verified."
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger build-binaries workflow
        uses: peter-evans/workflow-dispatch@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          workflow: build-binaries.yml
          # ref can be a branch or tag; pass the provided version/tag so builds run against the same ref
          ref: ${{ github.event.inputs.version }}

      - name: Trigger build-packages workflow
        uses: peter-evans/workflow-dispatch@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          workflow: build-packages.yml
          ref: ${{ github.event.inputs.version }}
