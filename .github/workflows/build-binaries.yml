name: Build release binaries (manual)

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      run-id:
        description: GitHub run id that produced the binary artifacts
        value: ${{ jobs.build.outputs.run-id }}

jobs:
  build:
    name: Build release for ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    outputs:
      run-id: ${{ steps.expose-run-id.outputs.run_id }}
    strategy:
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: claw-screenshot-linux-amd64.tar.gz
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: claw-screenshot-linux-arm64.tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Add target
        run: |
          rustup target add ${{ matrix.target }}

      - name: Build release
        env:
          CARGO_TARGET_DIR: target
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        run: |
          mkdir -p release
          BIN=target/${{ matrix.target }}/release/claw-screenshot
          if [ ! -f "$BIN" ]; then echo "Binary not found: $BIN" && exit 1; fi
          tar -czf release/${{ matrix.artifact }} -C $(dirname $BIN) $(basename $BIN)

      - name: Compute checksums and normalize artifact name
        run: |
          VERSION=$(awk -F '"' '/^version/ {print $2; exit}' Cargo.toml)
          ARCH=$(echo "${{ matrix.target }}" | sed 's/-unknown.*//; s/x86_64/amd64/; s/aarch64/arm64/')
          OUT=release/claw-screenshot-${ARCH}-${VERSION}.tar.gz
          if [ -f "release/${{ matrix.artifact }}" ]; then
            mv "release/${{ matrix.artifact }}" "$OUT"
          fi
          sha256sum "$OUT" > "$OUT.sha256" || true

      - name: Build artifacts manifest
        run: |
          MANIFEST=release/artifacts-manifest.json
          echo '{"artifacts": [' > "$MANIFEST"
          first=1
          for f in release/claw-screenshot-*; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            sha="$(sha256sum "$f" | awk '{print $1}')"
            if [ "$first" -eq 1 ]; then
              first=0
            else
              echo ',' >> "$MANIFEST"
            fi
            printf '{"file":"%s","sha256":"%s"}' "$base" "$sha" >> "$MANIFEST"
          done
          echo ']}' >> "$MANIFEST"
          cat "$MANIFEST"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: claw-screenshot-${{ matrix.target }}.tar.gz
          path: |
            release/claw-screenshot-*.tar.gz
            release/claw-screenshot-*.sha256
            release/artifacts-manifest.json
          retention-days: 30
          overwrite: true

      - name: Show release file
        run: ls -l release || true

      - name: Expose workflow run id
        id: expose-run-id
        run: echo "run_id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
