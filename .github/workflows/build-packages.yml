name: Build .deb and .rpm packages (manual)

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      run-id:
        description: GitHub run id that produced the package artifacts
        value: ${{ jobs.pack.outputs.run-id }}

jobs:
  pack:
    name: Build packages for ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    outputs:
      run-id: ${{ steps.expose-run-id.outputs.run_id }}
    strategy:
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: amd64
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Build release
        env:
          CARGO_TARGET_DIR: target
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare packaging tree
        run: |
          mkdir -p package_root/DEBIAN
          mkdir -p package_root/usr/local/bin
          mkdir -p package_root/usr/share/applications
          BIN=target/${{ matrix.target }}/release/claw-screenshot
          cp "$BIN" package_root/usr/local/bin/
          chmod 0755 package_root/usr/local/bin/claw-screenshot
          # create DEBIAN/control
          PACKAGE_RAW=$(awk -F '"' '/^version/ {print $2; exit}' Cargo.toml)
          if echo "$PACKAGE_RAW" | grep -qE '^[0-9]'; then
            PACKAGE_VERSION="$PACKAGE_RAW"
          else
            PACKAGE_VERSION="1.0.0-$PACKAGE_RAW"
          fi
          cat > package_root/DEBIAN/control <<EOF
          Package: claw-screenshot
          Version: $PACKAGE_VERSION
          Section: utils
          Priority: optional
          Architecture: ${{ matrix.arch }}
          Depends: 
          Maintainer: Mak Makoni <mak@example.com>
          Description: Claw Screenshot Helper
           A small utility to request screenshots via the FreeDesktop portal and save them to ~/clawd/screenshots.
          EOF
          # create desktop entry
          cat > package_root/usr/share/applications/claw-screenshot.desktop <<'DESK'
          [Desktop Entry]
          Type=Application
          Name=Claw Screenshot Helper
          Exec=/usr/local/bin/claw-screenshot
          Icon=claw-screenshot
          Terminal=false
          Categories=Utility;
          StartupNotify=true
          DESK

      - name: Build .deb
        if: ${{ always() }}
        run: |
          VERSION=$(awk -F '"' '/^version/ {print $2; exit}' Cargo.toml)
          PKGNAME=claw-screenshot-${{ matrix.arch }}-${VERSION}.deb
          dpkg-deb --build package_root "$PKGNAME"
          ls -l "$PKGNAME"

      - name: Install fpm dependencies
        if: ${{ always() }}
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ruby ruby-dev build-essential
          sudo gem install --no-document fpm

      - name: Build .rpm using fpm
        if: always()
        run: |
          VERSION=$(awk -F '"' '/^version/ {print $2; exit}' Cargo.toml)
          PKGNAME=claw-screenshot-${{ matrix.arch }}-${VERSION}.rpm
          fpm -s dir -t rpm -n claw-screenshot -v "$VERSION" --architecture ${{ matrix.arch }} \
            --description "Claw Screenshot helper" \
            --license MIT \
            -C package_root usr/local/bin/claw-screenshot usr/share/applications/claw-screenshot.desktop
          ls -l *.rpm || true

      - name: Normalize package filenames
        run: |
          set -e
          VERSION=$(awk -F '"' '/^version/ {print $2; exit}' Cargo.toml)
          if ls *.deb 1> /dev/null 2>&1; then
            for f in *.deb; do 
              target_name="claw-screenshot-${{ matrix.arch }}-${VERSION}.deb";
              [ "$f" != "$target_name" ] && mv "$f" "$target_name" || true;
            done
          fi
          if ls *.rpm 1> /dev/null 2>&1; then
            for f in *.rpm; do 
              target_name="claw-screenshot-${{ matrix.arch }}-${VERSION}.rpm";
              [ "$f" != "$target_name" ] && mv "$f" "$target_name" || true;
            done
          fi
          ls -l || true

      - name: Build artifacts manifest
        run: |
          MANIFEST=artifacts-manifest.json
          echo '{"artifacts": [' > "$MANIFEST"
          first=1
          for f in *.deb *.rpm; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            sha="$(sha256sum "$f" | awk '{print $1}')"
            if [ "$first" -eq 1 ]; then
              first=0
            else
              echo ',' >> "$MANIFEST"
            fi
            printf '{"file":"%s","sha256":"%s"}' "$base" "$sha" >> "$MANIFEST"
          done
          echo ']}' >> "$MANIFEST"
          cat "$MANIFEST"

      - name: Upload .deb artifact (if present)
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) }}
        uses: actions/upload-artifact@v4
        with:
          name: claw-screenshot-${{ matrix.arch }}.deb
          path: |
            claw-screenshot-${{ matrix.arch }}-*.deb
            artifacts-manifest.json
          retention-days: 30
          overwrite: true

      - name: Upload .rpm artifact (if present)
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) }}
        uses: actions/upload-artifact@v4
        with:
          name: claw-screenshot-${{ matrix.arch }}.rpm
          path: |
            claw-screenshot-${{ matrix.arch }}-*.rpm
            artifacts-manifest.json
          retention-days: 30
          overwrite: true

      - name: Show produced files
        run: ls -l || true

      - name: Expose workflow run id
        id: expose-run-id
        run: echo "run_id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
